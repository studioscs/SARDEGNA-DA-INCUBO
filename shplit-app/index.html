<title>SHplit</title>
<style>
/* Palette ripresa da SISMA16: Blu Polvere, Verde Salvia, Grigio Chiaro */
:root{
  --p:#50829D;--p-dark:#3E6880;--p-deep:#1C3140;--p-50:#EBF2F5;--p-100:#D0E1E8;
  --pos:#4D704D;--pos-50:#F2F6F2;--neg:#A85A4E;--neg-50:#F8EEEC;
  --bg:#F0F2F5;--card:#FFFFFF;--line:#E4E7EB;--text:#374151;--muted:#8A94A3;
  --shadow:0 1px 3px rgba(28,49,64,.06);
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
:root[data-theme=dark]{
  --p:#8DB5C9;--p-dark:#B0CEDB;--p-deep:#E0E0E0;--p-50:rgba(80,130,157,.2);--p-100:rgba(80,130,157,.35);
  --pos:#A3C0A2;--pos-50:rgba(101,143,100,.18);--neg:#E0A196;--neg-50:rgba(168,90,78,.2);
  --bg:#121212;--card:#1E1E1E;--line:#2D3748;--text:#E0E0E0;--muted:#8B95A3;--shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font:16px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.hidden{display:none!important}

/* Barra superiore */
#top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;
  padding:calc(10px + var(--safe-t)) 10px 10px;background:var(--bg)}
#top h1{flex:1;margin:0 4px;font-size:21px;font-weight:700;color:var(--p-deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{background:none;border:0;padding:8px;border-radius:12px;color:var(--p-deep);display:flex}
.ib:active{background:var(--p-50)}
#view{padding:0 14px calc(110px + var(--safe-b));max-width:640px;margin:0 auto}

/* Card e righe */
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);margin:10px 0;overflow:hidden}
.pad{padding:16px}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.tap{cursor:pointer}.row.tap:active{background:var(--p-50)}
.grow{flex:1;min-width:0}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{font-size:13px;color:var(--muted)}
.amt{text-align:right;white-space:nowrap}
.amt b{display:block;font-size:15px}
.amt small{font-size:12px;color:var(--muted)}
.tile{width:42px;height:42px;border-radius:12px;background:var(--p-50);color:var(--p);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tile.big{width:52px;height:52px;border-radius:14px}
.tile.letter{font-weight:700;font-size:18px}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mut{color:var(--muted)}
.sec{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:20px 4px 6px}

/* Riepilogo saldo */
.hero{padding:18px 16px;text-align:center}
.hero .lab{font-size:14px;color:var(--muted)}
.hero .val{font-size:30px;font-weight:700;margin:2px 0}
.hero .alt{font-size:14px;color:var(--muted)}
.sync{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--muted);margin-top:10px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.ok{background:#658F64}.dot.err{background:var(--neg)}.dot.wait{background:#D9A441}

/* Bottoni */
.btn{border:0;border-radius:14px;padding:14px 16px;background:var(--p);color:#fff;font-weight:600;font-size:16px;
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn:active{background:var(--p-dark)}
.btn.sec2{background:var(--p-50);color:var(--p-dark)}
.btn.danger{background:var(--neg-50);color:var(--neg)}
.btn.sm{width:auto;padding:8px 12px;font-size:14px;border-radius:10px}
.stack>*+*{margin-top:10px}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + var(--safe-b));
  background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:4}
.bottom .btn{max-width:612px;margin:0 auto;box-shadow:0 6px 16px rgba(28,49,64,.18)}

/* Segmenti / pillole */
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:3px;margin:14px 0 4px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--p-deep);font-weight:600;box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:22px;padding:8px 14px;font-size:15px;display:flex;align-items:center;gap:6px}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.chip svg.ic{width:18px;height:18px}

/* Fogli modali */
.sheet{position:fixed;inset:0;background:rgba(18,26,33,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet-card{background:var(--bg);width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;
  padding:8px 16px calc(18px + var(--safe-b));animation:up .22s cubic-bezier(.16,1,.3,1)}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 8px}
.sh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sh h2{flex:1;margin:0;font-size:19px;color:var(--p-deep)}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:16px 2px 6px}
.in{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);outline:none;font-size:16px}
.in:focus{border-color:var(--p)}
.money{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:6px 14px}
.money:focus-within{border-color:var(--p)}
.money .cur{font-weight:700;color:var(--p);font-size:18px}
.money input{border:0;outline:none;background:none;font-size:30px;font-weight:700;width:100%;padding:6px 0}
.conv{font-size:14px;color:var(--muted);margin:6px 4px 0;min-height:20px}
.descrow{display:flex;gap:10px;align-items:center}
.descrow .tile{cursor:pointer}
.split{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.split:last-child{border-bottom:0}
.split input{width:110px;text-align:right;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);outline:none}
.hint{font-size:13px;margin:8px 2px}
.link{background:none;border:0;color:var(--p);font-weight:600;padding:8px 2px;font-size:14px}
.rate{display:flex;align-items:center;gap:8px;font-weight:600}
.rate input{flex:1}
.empty{text-align:center;color:var(--muted);padding:44px 24px}
.empty .tile{margin:0 auto 12px;width:64px;height:64px;border-radius:18px}
.empty .tile svg.ic{width:30px;height:30px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all;background:var(--card);border:1.5px dashed var(--p-100);border-radius:12px;padding:12px;user-select:all;-webkit-user-select:all}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%);background:var(--p-deep);color:var(--bg);
  padding:10px 18px;border-radius:22px;font-size:14px;z-index:30;max-width:90%;text-align:center}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch input{width:22px;height:22px;accent-color:var(--p)}
:root[data-theme=dark] .btn:not(.sec2):not(.danger),:root[data-theme=dark] .chip.on{color:#0F1B22}
.pick{display:flex;align-items:center;gap:12px;text-align:left;line-height:1.3}
.pick:disabled{opacity:.6}
.fl{font-size:26px;line-height:1;width:32px;text-align:center;flex-shrink:0;display:flex;justify-content:center;color:var(--p)}
.pickp{margin-top:8px;background:var(--card);border:1.5px solid var(--p-100);border-radius:14px;padding:8px}
.pickl{max-height:300px;overflow:auto;margin-top:6px}
.pickl .row{padding:10px 8px}
/* Avatar, selezioni a elenco */
.av{width:38px;height:38px;border-radius:50%;background:var(--p-50);color:var(--p-dark);font-weight:700;font-size:14px;letter-spacing:.02em;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row.sel{padding-top:10px;padding-bottom:10px}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;position:relative}
.radio.on{border-color:var(--p)}
.radio.on::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--p)}
.check{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:transparent;flex-shrink:0}
.check svg.ic{width:16px;height:16px;stroke-width:2.6}
.check.on{background:var(--p);border-color:var(--p);color:#fff}
.mini{width:104px;text-align:right;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);outline:none;font-size:15px}
.mini:focus{border-color:var(--p)}
.srch{display:flex;align-items:center;gap:8px;border:1.5px solid var(--p);border-radius:12px;padding:0 12px;background:var(--card);color:var(--p)}
.srch input{flex:1;border:0;outline:none;background:none;padding:12px 0;font-size:16px;color:var(--text)}
.btn.sm svg.ic{width:18px;height:18px}
.wrap{line-height:1.3;margin-bottom:2px}

</style>
</head>
<body>
<header id="top">
  <button id="backBtn" class="ib hidden" aria-label="Indietro"></button>
  <h1 id="title">SHplit</h1>
  <div id="topActions" style="display:flex;gap:2px"></div>
</header>
<main id="view"></main>
<div id="bottom" class="bottom hidden"></div>
<div id="sheet" class="sheet hidden"><div class="sheet-card" id="sheetCard"></div></div>
<div id="toast" class="toast hidden"></div>
<script>
// Server pubblici (rete Nostr) usati per la sincronizzazione cifrata.

</script>

  }).join('') + '</div>';
  if (joining.length) h += '<div class="card">' + joining.map(function (id) { return '<div class="row tap" data-g="' + id + '"><div class="tile">' + ic('cloud') + '</div><div class="grow"><div class="t">Collegamento al gruppo…</div><div class="s">In attesa dei dati</div></div></div>'; }).join('') + '</div>';
  h += '<div class="stack" style="margin-top:14px"><button class="btn sec2" data-act="join">' + ic('link') + 'Unisciti a un gruppo</button><button class="btn sec2" data-act="import">' + ic('swap') + 'Importa da Splitwise</button></div>';

var gtab = 'exp';
function renderGroup(v, g) {
  var gid = g.id;
  if (!g.meta) return renderJoining(v, g);
  if (!S.my[gid]) return pickMe(g);
  header(g.meta.name, '<button class="ib" data-act="invite" aria-label="Invita">' + ic('share') + '</button><button class="ib" data-act="gset" aria-label="Impostazioni gruppo">' + ic('settings') + '</button>');
  var n = myNet(g), d = dual(g, n, true);
  var h = '<div class="card hero"><div class="lab">' + (n > 0 ? 'Ti devono' : n < 0 ? 'Devi' : 'Sei in pari') + '</div>' +
    (n ? '<div class="val ' + (n > 0 ? 'pos' : 'neg') + '">' + d.main + '</div><div class="alt">' + d.alt + '</div>' : '<div class="val mut">' + ic('check') + '</div>') +
    syncBadge(gid) + '</div>';
  h += '<div class="seg"><button data-t="exp" class="' + (gtab === 'exp' ? 'on' : '') + '">Spese</button><button data-t="bal" class="' + (gtab === 'bal' ? 'on' : '') + '">Saldi</button></div>';
  if (gtab === 'exp') {
    var list = expenses(g);
    if (!list.length) h += '<div class="empty"><div class="tile">' + ic('other') + '</div><p>Ancora nessuna spesa.<br>Tocca <b>Aggiungi spesa</b> qui sotto.</p></div>';
    var day = '';
    list.forEach(function (e) {
      if (e.date !== day) { if (day) h += '</div>'; day = e.date; h += '<div class="sec">' + fmtDay(e.date) + '</div><div class="card">'; }
      h += expenseRow(g, e);
    });
    if (day) h += '</div>';
  } else {
    var net = nets(g), plan = simplify(net);
    h += '<div class="sec">Pagamenti da fare</div>';
    h += plan.length ? '<div class="card">' + plan.map(function (p, i) {
      var dd = dual(g, p.amount);
      return '<div class="row">' + avatar(g.members[p.from] ? g.members[p.from].name : '?') + '<div class="grow"><div class="wrap"><b>' + esc(mname(g, p.from, true)) + '</b> <span class="mut">' + (p.from === S.my[g.id] ? 'devi' : 'deve') + ' a</span> <b>' + esc(mname(g, p.to)) + '</b></div><div class="s"><b class="neg">' + dd.main + '</b>' + (dd.alt ? ' · ' + dd.alt : '') + '</div></div><button class="btn sm" data-pay="' + i + '">' + ic('payment') + 'Salda</button></div>';
    }).join('') + '</div>' : '<div class="card pad mut" style="text-align:center">Tutti in pari ' + ic('check') + '</div>';
    h += '<div class="sec">Saldo di ciascuno</div><div class="card">' + members(g).map(function (m) {
      var x = net[m.id] || 0, dd = dual(g, x, true), who = '';
      if (x < 0) who = plan.filter(function (p) { return p.from === m.id; }).map(function (p, i, a) { return (a.length > 1 ? money(p.amount, g.meta.base) + ' ' : '') + 'a ' + esc(mname(g, p.to)); }).join(', ');
      if (x > 0) who = 'da ' + plan.filter(function (p) { return p.to === m.id; }).map(function (p, i, a) { return esc(mname(g, p.from)) + (a.length > 1 ? ' (' + money(p.amount, g.meta.base) + ')' : ''); }).join(', ');
      return '<div class="row">' + avatar(m.name) + '<div class="grow"><div class="t">' + esc(mname(g, m.id, true)) + '</div>' + (who ? '<div class="s">' + (x < 0 ? 'deve dare ' : 'deve ricevere ') + who + '</div>' : '') + '</div><div class="amt">' +
        (x > 0 ? '<span class="pos">riceve<b>' + dd.main + '</b></span>' : x < 0 ? '<span class="neg">deve<b>' + dd.main + '</b></span>' : '<span class="mut">in pari</span>') + '</div></div>';
    }).join('') + '</div>';
    var tot = 0, mine = 0;
    expenses(g).forEach(function (e) { if (e.type !== 'payment') { tot += e.amount; mine += e.shares[S.my[gid]] || 0; } });
    var dt = dual(g, tot), dm = dual(g, mine);
    h += '<div class="sec">Totali</div><div class="card"><div class="row"><div class="grow">Spesa del gruppo</div><div class="amt"><b>' + dt.main + '</b><small>' + dt.alt + '</small></div></div><div class="row"><div class="grow">La tua parte</div><div class="amt"><b>' + dm.main + '</b><small>' + dm.alt + '</small></div></div></div>';
    v.innerHTML = h;
    $$('[data-pay]', v).forEach(function (b) { b.onclick = function () { var p = plan[+b.dataset.pay]; paymentSheet(g, p.from, p.to, p.amount); }; });
  }
  if (gtab === 'exp') v.innerHTML = h;
  $$('.seg [data-t]', v).forEach(function (b) { b.onclick = function () { gtab = b.dataset.t; render(); }; });
  $$('[data-e]', v).forEach(function (el) { el.onclick = function () { expenseDetail(g, g.expenses[el.dataset.e]); }; });
  bottom('<button class="btn" data-act="addExp">' + ic('plus') + 'Aggiungi spesa</button>');
}
function expenseRow(g, e) {
  var me = S.my[g.id], sub, right;
  if (e.type === 'payment') {
    var to = Object.keys(e.shares)[0];
    return '<div class="row tap" data-e="' + e.id + '"><div class="tile">' + ic('payment') + '</div><div class="grow"><div class="t">' + esc(mname(g, e.payer, true)) + ' ha dato a ' + esc(mname(g, to)) + '</div><div class="s">Rimborso</div></div><div class="amt"><b>' + money(e.orig, e.cur) + '</b></div></div>';
  }
  sub = e.payers ? 'Pagato da più persone' : (e.payer === me ? 'Hai pagato' : 'Ha pagato ' + esc(mname(g, e.payer)));
  var alt = e.cur !== g.meta.base ? money(e.amount, g.meta.base) : (g.meta.local && g.meta.rate ? '≈ ' + money(localFrom(e.amount, g.meta.base, g.meta.local, g.meta.rate), g.meta.local) : '');
  var myShare = e.shares[me] || 0, net = (e.payers ? (e.payers[me] || 0) : (e.payer === me ? e.amount : 0)) - myShare;
  right = '<b>' + money(e.orig, e.cur) + '</b><small>' + alt + '</small>';
  var tag = net > 0 ? '<span class="pos"> · ti spettano ' + money(net, g.meta.base) + '</span>' : net < 0 ? '<span class="neg"> · la tua parte ' + money(-net, g.meta.base) + '</span>' : '';
  return '<div class="row tap" data-e="' + e.id + '"><div class="tile">' + ic(e.cat || 'other') + '</div><div class="grow"><div class="t">' + esc(e.desc) + '</div><div class="s">' + sub + tag + '</div></div><div class="amt">' + right + '</div></div>';
}

function renderJoining(v, g) {
  header('Collegamento…'); bottom('');
  var st = S.state[g.id] || {}, waited = Date.now() - (st.joining || Date.now()), n = connectedCount();
  v.innerHTML = '<div class="empty"><div class="tile">' + ic('cloud') + '</div><p><b>Sto scaricando il gruppo…</b><br>' +
    (!navigator.onLine ? 'Sei offline: collegati a internet.' : n ? 'Collegato a ' + n + ' server.' : 'Mi sto collegando ai server…') + '</p>' +
    (waited > 20000 ? '<p class="hint">Ci sta mettendo molto. Controlla di aver copiato tutto il codice e chiedi a chi ti ha invitato di aprire SHplit con internet attivo: i dati partono dal suo telefono.</p>' : '') +
    '</div><button class="btn danger" id="jcancel">Annulla</button>';
  $('#jcancel').onclick = function () { removeGroupLocal(g.id); stack = []; render(); };
  clearTimeout(renderJoining.t);
  renderJoining.t = setTimeout(function () { if (curGroup() === g.id && G(g.id) && !G(g.id).meta) render(); }, 4000);
}

    '<label class="f">Aspetto</label><div class="seg" id="th" style="margin-top:0">' + [['auto', 'Automatico'], ['light', 'Chiaro'], ['dark', 'Scuro']].map(function (x) { return '<button data-v="' + x[0] + '" class="' + (S.theme === x[0] ? 'on' : '') + '">' + x[1] + '</button>'; }).join('') + '</div>' +

    '<p class="hint mut" style="text-align:center;margin-top:24px">SHplit 3.1</p>';

  function syncInfo() {

    el.innerHTML = '<div class="switch"><span><b>Automatica, senza account</b><br><span class="s">I dati dei gruppi sono cifrati e condivisi tramite server pubblici gratuiti. Collegati ora: ' + n + ' su ' + RELAYS.length + '.</span></span>' + '<span class="dot ' + (n ? 'ok' : 'err') + '" style="width:10px;height:10px"></span></div>';
  }
  ensurePool(); syncInfo(); setTimeout(syncInfo, 2500);

    var n = $('#sn').value.trim(); if (!n) return toast('Il nome non può essere vuoto');
    S.me = n; save(); toast('Salvato'); back();
  };
  $('#sexp').onclick = function () { saveFile('shplit-backup-' + today() + '.json', JSON.stringify(S), 'application/json'); };
  $('#simp').onclick = function () { $('#sfile').click(); };
  $('#sfile').onchange = function () {
    var f = this.files[0]; if (!f) return;
    var r = new FileReader();

      try { var d = JSON.parse(r.result); if (d.v !== 2 || !d.groups) throw 0; if (!confirm('Sostituire tutti i dati di questo telefono con il backup?')) return; S = d; load(); save(); stack = []; render(); resubscribe(true); syncTick(); toast('Backup ripristinato'); }
      catch (e) { alert('File di backup non valido.'); }

/* ================= Fogli (modali) ================= */
function openSheet(html) { $('#sheetCard').innerHTML = '<div class="grab"></div>' + html; $('#sheet').classList.remove('hidden'); $('#sheetCard').scrollTop = 0; document.body.style.overflow = 'hidden'; }
function closeSheet() { $('#sheet').classList.add('hidden'); document.body.style.overflow = ''; }
function sheetHead(title) { return '<div class="sh"><h2>' + title + '</h2><button class="ib" data-close>' + ic('x') + '</button></div>'; }

// Crea / modifica gruppo
function groupSheet(g) {
  var isNew = !g, m = g ? Object.assign({}, g.meta) : { name: '', base: 'EUR', baseCountry: 'IT', local: '', localCountry: '', rate: null, display: 'base' };
  var names = isNew ? [] : null;
  var hasExp = g && expenses(g).length > 0;
  function pickerBtn(id, which, disabled) {
    var cur = which === 'local' ? m.local : m.base, cc = which === 'local' ? m.localCountry : m.baseCountry;
    var c = cur ? (cc ? country(cc) : countryForCur(cur)) : null;
    return '<button type="button" class="in pick" id="' + id + '"' + (disabled ? ' disabled' : '') + '>' +
      (c ? '<span class="fl">' + flag(c.cc) + '</span><span class="grow"><b>' + esc(c.name) + '</b> · ' + cur + '<br><span class="s">' + esc(curName(cur)) + '</span></span>'
         : '<span class="fl">' + ic('plus') + '</span><span class="grow mut">Nessuna – tocca per scegliere il Paese</span>') +
      '</button><div class="pickp hidden" id="' + id + 'p"></div>';
  }
  function togglePicker(which) {
    var id = which === 'local' ? 'gl' : 'gb', panel = $('#' + id + 'p');
    if (!panel.classList.contains('hidden')) { panel.classList.add('hidden'); return; }
    $$('.pickp').forEach(function (p) { p.classList.add('hidden'); });
    panel.innerHTML = '<div class="srch">' + ic('search') + '<input id="' + id + 'q" placeholder="Cerca Paese o valuta: Giappone, yen, JPY…" autocomplete="off"></div><div class="pickl" id="' + id + 'l"></div>';
    panel.classList.remove('hidden');
    function list(q) {
      q = norm(q || '').trim();
      var items = COUNTRIES.filter(function (c) { return !q || norm(c.name + ' ' + c.cur + ' ' + curName(c.cur)).indexOf(q) >= 0; })
        .sort(function (a, b) { return a.name.localeCompare(b.name, 'it'); });
      var h = (which === 'local' && !q ? '<div class="row tap" data-cc=""><span class="fl">' + ic('x') + '</span><div class="grow">Nessuna seconda valuta</div></div>' : '') +
        items.map(function (c) { return '<div class="row tap" data-cc="' + c.cc + '"><span class="fl">' + flag(c.cc) + '</span><div class="grow"><div class="t">' + esc(c.name) + '</div><div class="s">' + c.cur + ' · ' + esc(curName(c.cur)) + '</div></div></div>'; }).join('');
      $('#' + id + 'l').innerHTML = h || '<div class="row mut">Nessun risultato</div>';
      $$('[data-cc]', $('#' + id + 'l')).forEach(function (el) {
        el.onclick = function () {
          keepFields();
          var c = country(el.dataset.cc);
          if (which === 'local') { m.local = c ? c.cur : ''; m.localCountry = c ? c.cc : ''; if (m.local === m.base) { toast('È uguale alla valuta principale'); m.local = ''; m.localCountry = ''; } }
          else { m.base = c.cur; m.baseCountry = c.cc; if (m.local === m.base) { m.local = ''; m.localCountry = ''; } }
          draw();
        };
      });
    }
    list('');
    $('#' + id + 'q').oninput = function () { list(this.value); };
    $('#' + id + 'q').focus();
  }
  function keepFields() { var n = $('#gn'), r = $('#gr'); if (n) m.name = n.value; if (r && r.value) m.rate = parseNum(r.value) || m.rate; }
  function draw() {
    var h = sheetHead(isNew ? 'Nuovo gruppo' : 'Impostazioni gruppo');
    h += '<label class="f">Nome</label><input class="in" id="gn" value="' + esc(m.name) + '" placeholder="Es. Thailandia 2026" autocomplete="off">';
    if (isNew) {
      h += '<label class="f">Chi partecipa</label><div class="chips" id="gm"><span class="chip on">' + esc(S.me) + ' (tu)</span>' + names.map(function (n, i) { return '<button class="chip on" data-rm="' + i + '">' + esc(n) + ' ' + ic('x') + '</button>'; }).join('') + '</div>' +
        '<div style="display:flex;gap:8px;margin-top:10px"><input class="in" id="gadd" placeholder="Aggiungi un nome" autocomplete="off"><button class="btn sm" id="gaddb" style="padding:0 16px">' + ic('plus') + '</button></div>';
    } else {
      h += '<label class="f">Partecipanti</label><div class="card">' + members(g).map(function (x) {
        return '<div class="row">' + avatar(x.name) + '<div class="grow t">' + esc(x.name) + (x.id === S.my[g.id] ? ' <span class="s">(tu)</span>' : '') + '</div><button class="ib" data-ren="' + x.id + '">' + ic('edit') + '</button></div>';
      }).join('') + '</div><div style="display:flex;gap:8px"><input class="in" id="gadd" placeholder="Aggiungi un partecipante" autocomplete="off"><button class="btn sm" id="gaddb" style="padding:0 16px">' + ic('plus') + '</button></div>';
    }
    h += '<label class="f">Valuta principale</label>' + pickerBtn('gb', 'base', hasExp) +
      (hasExp ? '<div class="hint mut">Non modificabile dopo la prima spesa: i saldi sono calcolati in questa valuta.</div>' : '');
    h += '<label class="f">Paese che visiti (seconda valuta)</label>' + pickerBtn('gl', 'local');
    h += '<div id="grw" class="' + (m.local ? '' : 'hidden') + '"><label class="f">Cambio (cercalo online e inseriscilo)</label><div class="rate"><span>1 <span id="gbl">' + m.base + '</span> =</span><input class="in" id="gr" inputmode="decimal" value="' + (m.rate ? fmtRate(m.rate) : '') + '" placeholder="0,00"><span id="gll">' + (m.local || '') + '</span></div>' +
      '<div class="hint mut" id="grinv"></div>' +
      (isNew ? '' : '<label class="f">Mostra i saldi in</label><div class="seg" id="gd" style="margin-top:0"><button data-v="base" class="' + (m.display !== 'local' ? 'on' : '') + '">' + esc(curLabel(m, 'base')) + '</button><button data-v="local" class="' + (m.display === 'local' ? 'on' : '') + '">' + esc(m.local ? curLabel(m, 'local') : '') + '</button></div><div class="hint mut">Il nuovo cambio vale per le spese inserite da ora in poi; quelle già inserite mantengono il cambio del momento.</div>') + '</div>';
    h += '<div class="stack" style="margin-top:20px"><button class="btn" id="gok">' + (isNew ? 'Crea gruppo' : 'Salva') + '</button>' +
      (isNew ? '' : '<button class="btn sec2" data-act="invite">' + ic('share') + 'Invita nel gruppo</button><button class="btn danger" id="gleave">Rimuovi gruppo da questo telefono</button>') + '</div>';
    openSheet(h);
    function rateHint() {
      var r = parseNum($('#gr').value), b = m.base, l = m.local;
      $('#grinv').textContent = r > 0 && l ? '1 ' + l + ' = ' + fmtRate(1 / r) + ' ' + b : '';
    }
    $('#gb').onclick = function () { togglePicker('base'); };
    $('#gl').onclick = function () { togglePicker('local'); };
    $('#gr').oninput = function () { m.rate = parseNum(this.value) || null; rateHint(); }; rateHint();
    $('#gn').oninput = function () { m.name = this.value; };
    $$('#gd button').forEach(function (b) { b.onclick = function () { m.display = b.dataset.v; $$('#gd button').forEach(function (x) { x.classList.toggle('on', x === b); }); }; });
    function add() {
      var n = $('#gadd').value.trim(); if (!n) return;
      m.rate = parseNum($('#gr').value) || m.rate;
      if (isNew) { names.push(n); draw(); $('#gadd').focus(); }
      else { var id = uid(10); change(g.id, 'member', id, { name: n, createdAt: Date.now() }); draw(); toast(n + ' aggiunto'); }
    }
    $('#gaddb').onclick = add;
    $('#gadd').onkeydown = function (ev) { if (ev.key === 'Enter') add(); };
    $$('[data-rm]').forEach(function (b) { b.onclick = function () { names.splice(+b.dataset.rm, 1); draw(); }; });
    $$('[data-ren]').forEach(function (b) {
      b.onclick = function () {
        var x = g.members[b.dataset.ren], n = prompt('Nuovo nome', x.name);
        if (n && n.trim()) { change(g.id, 'member', x.id, Object.assign({}, x, { name: n.trim() })); draw(); }
      };
    });
    $('#gok').onclick = function () {
      var name = $('#gn').value.trim(), base = m.base, local = m.local, rate = parseNum($('#gr').value);
      if (!name) return toast('Dai un nome al gruppo');
      if (local === base) local = '';
      if (local && !(rate > 0)) return toast('Inserisci il cambio tra ' + base + ' e ' + local);
      var meta = { name: name, base: base, baseCountry: m.baseCountry || '', local: local || '', localCountry: local ? (m.localCountry || '') : '', rate: local ? rate : null, display: local ? (m.display || 'base') : 'base', createdAt: (g && g.meta.createdAt) || Date.now() };
      if (isNew) {
        if (!names.length) return toast('Aggiungi almeno un\'altra persona');
        var gid = uid(16);
        S.groups[gid] = { id: gid, meta: null, members: {}, expenses: {} };
        S.order.unshift(gid);
        S.gkey[gid] = b64u(L().randomBytes(32));
        var myId = uid(10); S.my[gid] = myId;
        change(gid, 'meta', 'meta', meta);
        change(gid, 'member', myId, { name: S.me, createdAt: Date.now() });
        names.forEach(function (n, i) { change(gid, 'member', uid(10), { name: n, createdAt: Date.now() + i + 1 }); });
        resubscribe(); closeSheet(); go('group', gid);
        setTimeout(function () { inviteSheet(G(gid)); }, 400);
      } else {
        change(g.id, 'meta', 'meta', meta); closeSheet(); render(); toast('Salvato');
      }
    };
    var lv = $('#gleave');
    if (lv) lv.onclick = function () {
      if (!confirm('Rimuovere il gruppo da questo telefono?' + (S.gkey[g.id] ? ' I dati restano sugli altri telefoni: potrai rientrare con il codice d\'invito.' : ' Il gruppo non è sincronizzato: i dati andranno persi.'))) return;
      removeGroupLocal(g.id); closeSheet(); stack = []; render();
    };
  }
  draw();
  if (isNew) setTimeout(function () { $('#gn').focus(); }, 80);
}

    '<div class="row tap" data-me="_new"><div class="tile">' + ic('plus') + '</div><div class="grow t">Non sono in elenco: aggiungi «' + esc(S.me) + '»</div></div></div>';

/* ================= Importazione da Splitwise (CSV) =================
   Formato dell'esportazione di un gruppo Splitwise:
   Date, Description, Category, Cost, Currency, <una colonna per persona con il suo saldo nella spesa>
   (positivo = ha anticipato più della sua parte). In fondo c'è la riga "Total balance". */
function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  var first = text.split(/\r?\n/)[0] || '';
  var delim = (first.split(';').length > first.split(',').length) ? ';' : ',';
  var rows = [], row = [], f = '', q = false;
  for (var i = 0; i < text.length; i++) {
    var c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.filter(function (r) { return r.some(function (x) { return String(x).trim(); }); });
}
function parseSplitwise(text) {
  var rows = parseCSV(text);
  if (rows.length < 2) throw new Error('Il file è vuoto.');
  var h = rows[0].map(function (x) { return norm(x).trim(); });
  function col(names) { for (var i = 0; i < h.length; i++) if (names.indexOf(h[i]) >= 0) return i; return -1; }
  var cDate = col(['date', 'data', 'datum', 'fecha']), cDesc = col(['description', 'descrizione', 'beschreibung', 'descripcion']);
  var cCat = col(['category', 'categoria', 'kategorie']), cCost = col(['cost', 'costo', 'kosten', 'importo', 'amount']), cCur = col(['currency', 'valuta', 'wahrung', 'moneda']);
  if (cDate < 0 || cDesc < 0 || cCost < 0 || cCur < 0) throw new Error('Non sembra un\'esportazione di Splitwise: mancano le colonne Data, Descrizione, Costo o Valuta.');
  var firstPerson = Math.max(cDate, cDesc, cCat, cCost, cCur) + 1;
  var people = rows[0].slice(firstPerson).map(function (x) { return String(x).trim(); });
  if (people.length < 2) throw new Error('Nel file non trovo le colonne con i nomi dei partecipanti.');
  var items = [], skipped = 0;
  rows.slice(1).forEach(function (r) {
    var desc = String(r[cDesc] || '').trim(), date = String(r[cDate] || '').trim(), cur = String(r[cCur] || '').trim().toUpperCase();
    if (/total balance|saldo totale/i.test(desc) || !date || !cur) return;
    var cost = parseNum(r[cCost]);
    var netv = people.map(function (_, i) { var v = parseNum(r[firstPerson + i]); return isFinite(v) ? v : 0; });
    if (!isFinite(cost)) { skipped++; return; }
    var d = /^\d{4}-\d{2}-\d{2}/.test(date) ? date.slice(0, 10) : (function () { var x = new Date(date); return isNaN(x) ? today() : x.getFullYear() + '-' + pad(x.getMonth() + 1) + '-' + pad(x.getDate()); })();
    items.push({ date: d, desc: desc || 'Spesa', cat: cCat >= 0 ? String(r[cCat] || '').trim() : '', cost: cost, cur: cur, nets: netv });
  });
  if (!items.length) throw new Error('Nel file non ho trovato spese.');
  return { people: people, items: items, skipped: skipped };
}
// Converte una riga Splitwise in una spesa SHplit (importi nella valuta principale del gruppo).
function importRow(it, ids, base, rates) {
  var cur = it.cur, r = cur === base ? null : rates[cur];
  var cMinor = Math.round(Math.abs(it.cost) * Math.pow(10, dec(cur)));
  var amount = baseFrom(cMinor, cur, base, r);
  var nb = it.nets.map(function (v) { return baseFrom(Math.round(v * Math.pow(10, dec(cur))), cur, base, r); });
  // arrotondamenti: la somma dei saldi deve essere zero
  var sum = nb.reduce(function (a, b) { return a + b; }, 0);
  if (sum) { var big = 0; nb.forEach(function (v, i) { if (Math.abs(v) > Math.abs(nb[big])) big = i; }); nb[big] -= sum; }
  var pos = [], neg = [];
  nb.forEach(function (v, i) { if (v > 0) pos.push(i); else if (v < 0) neg.push(i); });
  if (!pos.length) return null; // nessuno ha anticipato nulla: non cambia i saldi
  var isPay = /^(payment|pagamento|zahlung|pago)$/i.test(norm(it.cat)) || (/\b(paid|ha pagato)\b/i.test(it.desc) && pos.length === 1 && neg.length === 1 && nb[pos[0]] === amount);
  var e = { type: isPay ? 'payment' : 'expense', desc: isPay ? 'Rimborso' : it.desc, cur: cur, orig: cMinor, rate: r, amount: amount, date: it.date, imported: true, createdAt: Date.now() };
  e.cat = isPay ? 'payment' : (guessCat(it.desc) !== 'other' ? guessCat(it.desc) : guessCat(it.cat));
  if (isPay) { e.payer = ids[pos[0]]; e.shares = {}; e.shares[ids[neg[0]]] = nb[pos[0]]; e.amount = nb[pos[0]]; return e; }
  e.shares = {};
  if (pos.length === 1) {
    var p = pos[0]; e.payer = ids[p];
    neg.forEach(function (i) { e.shares[ids[i]] = -nb[i]; });
    var own = amount - nb[p]; if (own > 0) e.shares[ids[p]] = own;
  } else {
    e.payer = ids[pos[0]]; e.payers = {};
    pos.forEach(function (i) { e.payers[ids[i]] = nb[i]; });
    neg.forEach(function (i) { e.shares[ids[i]] = -nb[i]; });
  }
  return e;
}

    var c = calc(); if (c.err) return toast(c.err);
    var data = {
      type: 'expense', desc: st.desc.trim(), cat: st.cat, catManual: st.catManual, cur: st.cur, orig: c.minor, rate: c.rate, amount: c.base,
      payer: st.payer, shares: c.shares, custom: st.custom ? Object.assign({}, st.custom) : null, date: st.date,
      by: me, createdAt: e ? e.createdAt : Date.now()
    };
    change(g.id, 'expense', e ? e.id : uid(12), data);
    closeSheet(); render(); toast('Spesa salvata');
  }
  draw();
  if (!e) setTimeout(function () { var a = $('#xa'); if (a) a.focus(); }, 80);
}

function expenseDetail(g, e) {
  var m = g.meta, isPay = e.type === 'payment';
  var h = sheetHead(isPay ? 'Rimborso' : esc(e.desc));
  h += '<div class="card hero"><div class="tile big" style="margin:0 auto 8px">' + ic(isPay ? 'payment' : e.cat) + '</div><div class="val">' + money(e.orig, e.cur) + '</div>';
  if (e.cur !== m.base) h += '<div class="alt">= ' + money(e.amount, m.base) + ' · cambio 1 ' + m.base + ' = ' + fmtRate(e.rate) + ' ' + e.cur + '</div>';
  else if (m.local && m.rate) h += '<div class="alt">≈ ' + money(localFrom(e.amount, m.base, m.local, m.rate), m.local) + '</div>';
  h += '<div class="s" style="margin-top:6px">' + fmtDay(e.date) + (isPay ? '' : ' · ' + catLabel(e.cat)) + '</div></div>';
  if (e.payers) {
    h += '<div class="card">' + Object.keys(e.payers).map(function (id) { return '<div class="row"><div class="grow">' + esc(mname(g, id, true)) + ' riceve</div><div class="amt"><b class="pos">' + money(e.payers[id], m.base) + '</b></div></div>'; }).join('');
    Object.keys(e.shares).forEach(function (id) { h += '<div class="row"><div class="grow">' + esc(mname(g, id, true)) + ' deve</div><div class="amt"><b class="neg">' + money(e.shares[id], m.base) + '</b></div></div>'; });
  } else {
  h += '<div class="card"><div class="row"><div class="grow">' + (isPay ? 'Ha dato' : 'Ha pagato') + '</div><div class="t">' + esc(mname(g, e.payer, true)) + '</div></div>';
  Object.keys(e.shares).forEach(function (id) {
    h += '<div class="row"><div class="grow">' + (isPay ? 'Ha ricevuto ' : 'Parte di ') + esc(mname(g, id)) + '</div><div class="amt"><b>' + money(e.shares[id], m.base) + '</b></div></div>';
  });
  }
  h += '</div>';
  if (e.imported) h += '<div class="hint mut">Importata da Splitwise' + (e.payers ? ': pagata da più persone, sono riportati solo i saldi di ciascuno.' : '') + '</div>';
  else if (e.by && g.members[e.by]) h += '<div class="hint mut">Inserita da ' + esc(mname(g, e.by)) + '</div>';
  h += '<div class="stack" style="margin-top:14px">' + (isPay || e.payers ? '' : '<button class="btn sec2" id="dedit">' + ic('edit') + 'Modifica</button>') + '<button class="btn danger" id="ddel">' + ic('trash') + 'Elimina</button></div>';
  openSheet(h);
  var ed = $('#dedit'); if (ed) ed.onclick = function () { expenseSheet(g, e); };
  $('#ddel').onclick = function () {
    if (!confirm('Eliminare questa voce per tutti i partecipanti?')) return;
    change(g.id, 'expense', e.id, Object.assign({}, e, { deleted: true }));
    closeSheet(); render(); toast('Eliminata');
  };
}

function paymentSheet(g, from, to, baseAmount) {
  var m = g.meta, cur = m.display === 'local' && m.local ? m.local : m.base;
  var val = cur === m.base ? baseAmount : localFrom(baseAmount, m.base, m.local, m.rate);
  openSheet(sheetHead('Registra pagamento') +
    '<p>Conferma che <b>' + esc(mname(g, from, true).replace(/^Tu$/, 'tu')) + '</b> ha pagato <b>' + esc(mname(g, to)) + '</b>. Puoi correggere l\'importo se è stato saldato solo in parte.</p>' +
    (m.local ? '<div class="seg" id="pcur" style="margin-top:0"><button data-c="' + m.base + '" class="' + (cur === m.base ? 'on' : '') + '">' + m.base + '</button><button data-c="' + m.local + '" class="' + (cur === m.local ? 'on' : '') + '">' + m.local + '</button></div>' : '') +
    '<div class="money" style="margin-top:10px"><span class="cur" id="psym">' + cur + '</span><input id="pa" inputmode="decimal" value="' + String(val / Math.pow(10, dec(cur))).replace('.', ',') + '"></div>' +
    '<div class="stack" style="margin-top:18px"><button class="btn" id="pok">' + ic('check') + 'Conferma pagamento</button></div>');
  $$('#pcur button').forEach(function (b) {
    b.onclick = function () {
      cur = b.dataset.c; $('#psym').textContent = cur;
      var v = cur === m.base ? baseAmount : localFrom(baseAmount, m.base, m.local, m.rate);
      $('#pa').value = String(v / Math.pow(10, dec(cur))).replace('.', ',');
      $$('#pcur button').forEach(function (x) { x.classList.toggle('on', x === b); });
    };
  });
  $('#pok').onclick = function () {
    var minor = toMinor($('#pa').value, cur); if (!(minor > 0)) return toast('Importo non valido');
    var r = cur === m.base ? null : m.rate, base = baseFrom(minor, cur, m.base, r);
    if (Math.abs(base - baseAmount) <= Math.max(1, Math.round(baseAmount * 0.005))) base = baseAmount; // evita centesimi residui dovuti al cambio
    var shares = {}; shares[to] = base;
    change(g.id, 'expense', uid(12), { type: 'payment', desc: 'Rimborso', cat: 'payment', cur: cur, orig: minor, rate: r, amount: base, payer: from, shares: shares, date: today(), by: S.my[g.id], createdAt: Date.now() });
    closeSheet(); render(); toast('Registrato');
  };
}

/* ================= Avvio ================= */
document.addEventListener('click', function (ev) {
  var t = ev.target.closest('[data-act],[data-close]'); if (!t) return;
  if (t.hasAttribute('data-close')) return closeSheet();
  var a = t.dataset.act, g = G(curGroup());
  if (a === 'settings') go('settings');
  else if (a === 'newGroup') groupSheet();
  else if (a === 'join') joinSheet();
  else if (a === 'import') importSheet();
  else if (a === 'gset' && g) groupSheet(g);
  else if (a === 'invite' && g) inviteSheet(g);
  else if (a === 'addExp' && g) expenseSheet(g);
  else if (a === 'enableSync' && g) enableSyncSheet(g);
});
$('#backBtn').onclick = back;
$('#sheet').addEventListener('click', function (ev) { if (ev.target.id === 'sheet') closeSheet(); });
window.dividiBack = function () {
  if (!$('#sheet').classList.contains('hidden')) { closeSheet(); return true; }
  if (stack.length) { back(); return true; }
  return false;
};
window.addEventListener('storage', function () { load(); render(); });
if (window.matchMedia) try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch (e) {}
load(); render(); setTimeout(syncTick, 300);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
window.__dividi = { parseSplitwise: function (t) { return parseSplitwise(t); }, importRow: function (a, b, c, d) { return importRow(a, b, c, d); }, guessCat: guessCat, splitEven: splitEven, simplify: simplify, baseFrom: baseFrom, localFrom: localFrom, parseInvite: parseInvite, parseNum: parseNum };
})();

</script>
