<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabaudi Bet — Scommesse Vacanza</title>
<style>
  :root{
    --sand:#FDF6E9;
    --sea:#0B7285;
    --sea-dark:#0A5C6B;
    --coral:#FF6B4A;
    --coral-dark:#E5502F;
    --sun:#FFC93C;
    --navy:#123047;
    --card:#FFFFFF;
    --border:#E7DCC4;
    --muted:#6E7B85;
    --radius:18px;
    --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--font);
    background:
      radial-gradient(ellipse 900px 500px at 10% -10%, #FFE8A3 0%, transparent 60%),
      radial-gradient(ellipse 900px 600px at 110% 0%, #BEEBEF 0%, transparent 55%),
      var(--sand);
    color:var(--navy);
    min-height:100vh;
    padding-bottom:80px;
  }
  .wrap{max-width:820px;margin:0 auto;padding:28px 18px 40px;}

  header.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:24px;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .logo{
    width:52px;height:52px;border-radius:16px;
    background:linear-gradient(135deg,var(--coral),var(--sun));
    display:flex;align-items:center;justify-content:center;
    font-size:26px;
    transform:rotate(-6deg);
    box-shadow:0 6px 16px rgba(255,107,74,0.35);
  }
  .brand h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-0.02em;}
  .brand p{margin:0;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.08em;}

  .userbox{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:8px 14px;
    display:flex;
    align-items:center;
    gap:10px;
    box-shadow:0 4px 12px rgba(18,48,71,0.06);
  }
  .userbox .name{font-weight:700;font-size:14px;}
  .userbox .balance{
    background:var(--sea);
    color:white;
    font-weight:800;
    font-size:13px;
    padding:4px 10px;
    border-radius:999px;
  }
  .userbox button{
    border:none;background:none;color:var(--muted);
    font-size:11px;text-decoration:underline;cursor:pointer;
    font-family:var(--font);
  }

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:22px;
    box-shadow:0 6px 20px rgba(18,48,71,0.06);
  }

  /* LOGIN */
  .login-card{max-width:420px;margin:60px auto 0;text-align:center;}
  .login-card h2{font-size:20px;margin:0 0 6px;}
  .login-card p{color:var(--muted);font-size:14px;margin:0 0 20px;}
  .login-row{display:flex;gap:8px;}
  input[type="text"], input[type="number"], input[type="password"]{
    font-family:var(--font);
    border:1.5px solid var(--border);
    border-radius:10px;
    padding:11px 13px;
    font-size:15px;
    width:100%;
    outline:none;
    transition:border-color 120ms ease, box-shadow 120ms ease;
    background:#FFFDF8;
    color:var(--navy);
  }
  input:focus{border-color:var(--sea);box-shadow:0 0 0 3px rgba(11,114,133,0.15);}
  .btn{
    font-family:var(--font);
    border:none;
    border-radius:10px;
    padding:11px 18px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    transition:transform 100ms ease, box-shadow 120ms ease, background 120ms ease;
    white-space:nowrap;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--coral);color:white;box-shadow:0 4px 12px rgba(255,107,74,0.35);}
  .btn-primary:hover{background:var(--coral-dark);}
  .btn-sea{background:var(--sea);color:white;}
  .btn-sea:hover{background:var(--sea-dark);}
  .btn-ghost{background:transparent;color:var(--sea);border:1.5px solid var(--sea);}
  .btn-ghost:hover{background:rgba(11,114,133,0.08);}
  .btn-small{padding:7px 12px;font-size:12px;}
  .btn:disabled{opacity:0.45;cursor:not-allowed;transform:none;}

  /* TABS */
  .tabs{display:flex;gap:6px;margin-bottom:20px;background:#F1E8D2;padding:5px;border-radius:12px;}
  .tab{
    flex:1;text-align:center;padding:9px 6px;border-radius:9px;
    font-weight:700;font-size:13px;cursor:pointer;color:var(--muted);
    transition:background 120ms ease, color 120ms ease;
  }
  .tab.active{background:var(--navy);color:white;}

  /* EVENT CARDS */
  .event{
    display:flex;gap:14px;align-items:flex-start;
    padding:16px;border:1px solid var(--border);border-radius:14px;
    margin-bottom:12px;background:#FFFDF8;
  }
  .event .emoji{font-size:28px;width:40px;text-align:center;flex-shrink:0;padding-top:4px;}
  .event .body{flex:1;min-width:0;}
  .event .desc{font-weight:700;font-size:15px;margin:0 0 6px;line-height:1.3;}
  .event .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .quota{
    background:var(--sun);color:var(--navy);font-weight:800;font-size:12px;
    padding:3px 10px;border-radius:999px;
  }
  .status{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;padding:3px 9px;border-radius:999px;}
  .status.aperta{background:#DCEEF0;color:var(--sea-dark);}
  .status.vinta{background:#D4EDDA;color:#155724;}
  .status.persa{background:#F8D7DA;color:#8a1f2b;}
  .bet-row{display:flex;gap:8px;align-items:center;}
  .bet-row input{max-width:120px;}
  .my-bet{font-size:12px;color:var(--muted);margin-top:6px;}
  .my-bet b{color:var(--navy);}

  /* LEADERBOARD */
  .lb-row{
    display:flex;align-items:center;gap:12px;padding:11px 4px;
    border-bottom:1px solid var(--border);
  }
  .lb-row:last-child{border-bottom:none;}
  .lb-rank{font-weight:800;color:var(--muted);width:22px;font-size:14px;}
  .lb-rank.gold{color:#C9971C;}
  .lb-name{flex:1;font-weight:700;font-size:14px;}
  .lb-balance{font-weight:800;color:var(--sea-dark);font-size:14px;}

  /* ADMIN */
  .admin-row{
    display:grid;grid-template-columns:1fr 90px auto;gap:10px;align-items:center;
    padding:10px 4px;border-bottom:1px solid var(--border);
  }
  .admin-row:last-child{border-bottom:none;}
  .admin-row .adesc{font-size:13px;font-weight:600;}
  .resolve-btns{display:flex;gap:5px;}
  .resolve-btns button{
    width:30px;height:30px;border-radius:8px;border:1.5px solid var(--border);
    background:white;cursor:pointer;font-size:14px;
    display:flex;align-items:center;justify-content:center;
    transition:background 100ms ease, border-color 100ms ease;
  }
  .resolve-btns button.on-yes{background:#D4EDDA;border-color:#8fcf9f;}
  .resolve-btns button.on-no{background:#F8D7DA;border-color:#e8a3ab;}
  .lock-note{background:#FFF3CD;color:#856404;font-size:12px;padding:10px 14px;border-radius:10px;margin-bottom:16px;}
  .section-title{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin:22px 0 10px;}
  .section-title:first-child{margin-top:0;}
  .hint{font-size:12px;color:var(--muted);margin-top:4px;}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--navy);color:white;padding:10px 20px;border-radius:999px;
    font-size:13px;font-weight:600;opacity:0;pointer-events:none;
    transition:opacity 200ms ease, transform 200ms ease;z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:20px;}

  /* WIN OVERLAY */
  .win-overlay{
    position:fixed;inset:0;
    background:rgba(18,48,71,0.72);
    display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:100;
    opacity:0;pointer-events:none;
    transition:opacity 200ms ease;
  }
  .win-overlay.show{opacity:1;pointer-events:auto;}
  .win-card{
    background:linear-gradient(160deg, #FFFDF8, #FFF4DE);
    border-radius:24px;padding:32px 26px;max-width:380px;width:100%;
    text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.35);
    animation:popIn 380ms cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popIn{
    from{transform:scale(0.7) translateY(20px);opacity:0;}
    to{transform:scale(1) translateY(0);opacity:1;}
  }
  .win-card .confetti{font-size:28px;letter-spacing:8px;margin-bottom:8px;}
  .win-card h2{margin:0 0 16px;font-size:26px;font-weight:900;color:var(--coral-dark);letter-spacing:-0.02em;}
  .win-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .win-item{
    display:flex;align-items:center;gap:8px;
    background:white;border:1px solid var(--border);border-radius:12px;
    padding:9px 12px;text-align:left;
  }
  .win-emoji{font-size:18px;}
  .win-desc{flex:1;font-size:12.5px;font-weight:600;}
  .win-amount{font-weight:800;color:#155724;font-size:13px;white-space:nowrap;}
  .win-total{font-size:14px;font-weight:700;margin-bottom:18px;color:var(--navy);}
  .win-card .btn{width:100%;}

  /* SETUP PAGE */
  .setup-card{max-width:520px;margin:40px auto 0;}
  .setup-card ol{padding-left:20px;font-size:13.5px;line-height:1.7;}
  .setup-card code{background:#F1E8D2;padding:2px 6px;border-radius:5px;font-size:12px;}
  .setup-card pre{
    background:var(--navy);color:#E9F3F5;padding:14px;border-radius:10px;
    font-size:11.5px;overflow-x:auto;line-height:1.6;
  }
  .lb-sub{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px;}
  .lb-name{flex:1;font-weight:700;font-size:14px;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<div class="win-overlay" id="winOverlay"></div>

<!-- Supabase JS SDK — usato come backend condiviso al posto dello storage di Claude -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* =======================================================================
   CONFIGURAZIONE SUPABASE — incolla qui i tuoi due valori
   (Settings → API: "Project URL" senza /rest/v1/ , e la chiave anon/publishable)
   ======================================================================= */
const SUPABASE_URL = "https://xkhouazttdqtsafcosno.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhraG91YXp0dGRxdHNhZmNvc25vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0MDU4MTQsImV4cCI6MjA5OTk4MTgxNH0.JNHAbZK7P7pDYPt6cz7oPyWBBXtRIE1e4iV2HTBAFQE";
/* ======================================================================= */

const MY_NAME_KEY = 'vacanza-sabaudi-mio-nome';
const STARTING_BALANCE = 1000;
const ADMIN_PIN = '2026';

const DEFAULT_EVENTS = [
  {id:'e01', emoji:'🏊', descr:'Romina ritorna a nuoto',                                 odds:1.8, resolved:null},
  {id:'e02', emoji:'⛴️', descr:'Care perde il traghetto perché Francesca fa tardi',       odds:3.2, resolved:null},
  {id:'e03', emoji:'😤', descr:'Jacopo sbrocca a Romina il secondo giorno',                odds:2.5, resolved:null},
  {id:'e04', emoji:'⏱️', descr:'Jacopo sbrocca a Romina nella prima ora',                  odds:4.0, resolved:null},
  {id:'e05', emoji:'⏳', descr:'Jacopo sbrocca a Romina dopo quindici minuti',              odds:6.5, resolved:null},
  {id:'e06', emoji:'🪑', descr:'Care rompe un mobile di casa nella prima settimana',        odds:2.8, resolved:null},
  {id:'e07', emoji:'🦵', descr:'Care rompe un ginocchio a Sara entro il settimo giorno',     odds:5.5, resolved:null},
  {id:'e08', emoji:'🚗', descr:"Care sfrigia la macchina all'ingresso della casa",           odds:3.5, resolved:null},
  {id:'e09', emoji:'🔥', descr:'Incendio sulla pineta di fianco casa',                      odds:8.0, resolved:null},
  {id:'e10', emoji:'🍢', descr:'Romina mangia gli arrosticini',                             odds:1.3, resolved:null},
];

/* MODELLO DATI
   - events: una riga per scommessa (solo l'admin la modifica)
   - bets:   una riga per (utente, evento) — ogni persona scrive solo le proprie
   - players: elenco iscritti
   Il SALDO NON viene mai salvato: si ricalcola da scommesse + esiti.
   Così due persone che agiscono insieme non si sovrascrivono mai a vicenda. */
let events = [];
let bets = [];
let players = [];

let currentUser = null;
let isAdmin = false;
let activeTab = 'bet';
let drafts = {};
let toastTimer = null;
let sb = null;
let loaded = false;

const configReady = !!(SUPABASE_URL && SUPABASE_URL.indexOf('INSERISCI') === -1 &&
                       SUPABASE_ANON_KEY && SUPABASE_ANON_KEY.indexOf('INSERISCI') === -1);

function fmt(n){ return Math.round(n*100)/100; }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}

/* ---------- SALDO CALCOLATO (mai salvato, quindi mai in conflitto) ---------- */
function betsOf(name){ return bets.filter(b=>b.player === name); }
function eventById(id){ return events.find(e=>e.id === id); }

function balanceOf(name){
  let bal = STARTING_BALANCE;
  betsOf(name).forEach(b=>{
    const ev = eventById(b.event_id);
    if(!ev) return;
    bal -= b.amount;                              // la puntata esce sempre
    if(ev.resolved === true) bal += b.amount * ev.odds;  // vinta: incassa
  });
  return fmt(bal);
}

function stakedOf(name){
  let s = 0;
  betsOf(name).forEach(b=>{
    const ev = eventById(b.event_id);
    if(ev && ev.resolved === null) s += b.amount;
  });
  return fmt(s);
}

function myBet(eventId){
  return bets.find(b=>b.player === currentUser && b.event_id === eventId) || null;
}

/* ---------- CARICAMENTO E SINCRONIZZAZIONE ---------- */
async function loadAll(){
  const [evRes, betRes, plRes] = await Promise.all([
    sb.from('sabaudi_events').select('*').order('id'),
    sb.from('sabaudi_bets').select('*'),
    sb.from('sabaudi_players').select('*')
  ]);
  events  = (evRes.data  || []).map(e=>({...e, odds: Number(e.odds), amount: undefined}));
  bets    = (betRes.data || []).map(b=>({...b, amount: Number(b.amount)}));
  players = (plRes.data  || []).map(p=>p.name);

  if(events.length === 0){
    await sb.from('sabaudi_events').insert(DEFAULT_EVENTS);
    const again = await sb.from('sabaudi_events').select('*').order('id');
    events = (again.data || []).map(e=>({...e, odds: Number(e.odds)}));
  }
  loaded = true;
}

function subscribeRealtime(){
  sb.channel('sabaudi-live')
    .on('postgres_changes', {event:'*', schema:'public', table:'sabaudi_events'},  onRemoteChange)
    .on('postgres_changes', {event:'*', schema:'public', table:'sabaudi_bets'},    onRemoteChange)
    .on('postgres_changes', {event:'*', schema:'public', table:'sabaudi_players'}, onRemoteChange)
    .subscribe();
}

async function onRemoteChange(){
  // ricarico i dati e ridisegno (a meno che l'utente stia scrivendo in un campo)
  try{
    const [evRes, betRes, plRes] = await Promise.all([
      sb.from('sabaudi_events').select('*').order('id'),
      sb.from('sabaudi_bets').select('*'),
      sb.from('sabaudi_players').select('*')
    ]);
    if(evRes.data)  events  = evRes.data.map(e=>({...e, odds: Number(e.odds)}));
    if(betRes.data) bets    = betRes.data.map(b=>({...b, amount: Number(b.amount)}));
    if(plRes.data)  players = plRes.data.map(p=>p.name);
  }catch(e){ return; }
  if(document.activeElement && document.activeElement.tagName === 'INPUT') return;
  render();
}

/* ---------- AZIONI ---------- */
async function login(name){
  name = (name||'').trim();
  if(!name) return;
  if(!players.includes(name)){
    const { error } = await sb.from('sabaudi_players').insert({ name });
    if(error && error.code !== '23505'){ showToast('Errore iscrizione, riprova.'); return; }
    if(!players.includes(name)) players.push(name);
  }
  currentUser = name;
  try{ localStorage.setItem(MY_NAME_KEY, name); }catch(e){}
  activeTab = 'bet';
  render();
}

function logout(){
  currentUser = null;
  isAdmin = false;
  try{ localStorage.removeItem(MY_NAME_KEY); }catch(e){}
  render();
}

async function placeBet(eventId, amountRaw){
  const amount = parseFloat(amountRaw);
  const ev = eventById(eventId);
  if(!ev){ showToast('Scommessa non trovata.'); return; }
  if(!amount || amount <= 0){ showToast('Inserisci un importo valido.'); return; }
  if(ev.resolved !== null){ showToast('Evento già risolto, non puoi più scommettere.'); return; }

  const existing = myBet(eventId);
  const available = balanceOf(currentUser) + (existing ? existing.amount : 0);
  if(amount > available){ showToast('Sabaudi insufficienti.'); return; }

  // scrive SOLO la propria riga → nessun conflitto con gli altri
  const { error } = await sb.from('sabaudi_bets')
    .upsert({ player: currentUser, event_id: eventId, amount: fmt(amount), celebrated: false },
            { onConflict: 'player,event_id' });
  if(error){ showToast('Errore nel salvare la scommessa.'); return; }

  if(existing){ existing.amount = fmt(amount); existing.celebrated = false; }
  else{ bets.push({ player: currentUser, event_id: eventId, amount: fmt(amount), celebrated: false }); }

  drafts[eventId] = '';
  showToast('Scommessa registrata: ' + fmt(amount) + ' sabaudi');
  render();
}

async function updateOdds(eventId, val){
  const odds = parseFloat(val);
  if(!odds || odds <= 0){ showToast('Quota non valida.'); return; }
  const { error } = await sb.from('sabaudi_events').update({ odds: fmt(odds) }).eq('id', eventId);
  if(error){ showToast('Errore nel salvare la quota.'); return; }
  const ev = eventById(eventId);
  if(ev) ev.odds = fmt(odds);
  showToast('Quota aggiornata.');
  render();
}

async function addEvent(descr, oddsRaw, emojiRaw){
  descr = (descr||'').trim();
  if(!descr){ showToast('Scrivi una descrizione per la nuova scommessa.'); return; }
  const odds = parseFloat(oddsRaw);
  if(!odds || odds <= 0){ showToast('Quota non valida.'); return; }
  const emoji = (emojiRaw||'').trim() || '🎲';
  const id = 'x' + Date.now();
  const { error } = await sb.from('sabaudi_events')
    .insert({ id, emoji, descr, odds: fmt(odds), resolved: null });
  if(error){ showToast('Errore nel creare la scommessa.'); return; }
  events.push({ id, emoji, descr, odds: fmt(odds), resolved: null });
  showToast('Nuova scommessa aggiunta.');
  render();
}

// L'admin tocca SOLO la riga dell'evento. I saldi si ricalcolano da soli
// su ogni dispositivo, quindi nessun pagamento può andare perso.
async function resolveEvent(eventId, outcome){
  const ev = eventById(eventId);
  if(!ev) return;
  const newVal = (ev.resolved === outcome) ? null : outcome;
  const { error } = await sb.from('sabaudi_events').update({ resolved: newVal }).eq('id', eventId);
  if(error){ showToast('Errore nel salvare l\'esito.'); return; }
  ev.resolved = newVal;
  render();
}

async function deleteEvent(eventId){
  if(!confirm('Eliminare questa scommessa e tutte le puntate collegate?')) return;
  await sb.from('sabaudi_bets').delete().eq('event_id', eventId);
  await sb.from('sabaudi_events').delete().eq('id', eventId);
  events = events.filter(e=>e.id !== eventId);
  bets = bets.filter(b=>b.event_id !== eventId);
  showToast('Scommessa eliminata.');
  render();
}

function tryAdminLogin(pin){
  if(pin === ADMIN_PIN){ isAdmin = true; activeTab = 'admin'; render(); }
  else showToast('PIN errato.');
}

/* ---------- SCHERMATA VITTORIA ---------- */
function getPendingWins(){
  if(!currentUser) return [];
  const wins = [];
  betsOf(currentUser).forEach(b=>{
    const ev = eventById(b.event_id);
    if(ev && ev.resolved === true && !b.celebrated){
      wins.push({ eventId: ev.id, descr: ev.descr, emoji: ev.emoji, payout: fmt(b.amount*ev.odds) });
    }
  });
  return wins;
}

function checkForWins(){
  const overlay = document.getElementById('winOverlay');
  if(!overlay) return;
  const wins = getPendingWins();
  if(wins.length === 0){ overlay.classList.remove('show'); overlay.innerHTML=''; return; }
  const total = fmt(wins.reduce((s,w)=>s+w.payout,0));
  overlay.innerHTML =
    '<div class="win-card">' +
      '<div class="confetti">🎉🎊✨🎊🎉</div>' +
      '<h2>HAI VINTO!</h2>' +
      '<div class="win-list">' +
        wins.map(w=>
          '<div class="win-item">' +
            '<span class="win-emoji">'+w.emoji+'</span>' +
            '<span class="win-desc">'+w.descr+'</span>' +
            '<span class="win-amount">+'+w.payout+' SAB</span>' +
          '</div>').join('') +
      '</div>' +
      '<div class="win-total">Totale vinto: <b>'+total+' sabaudi</b></div>' +
      '<button class="btn btn-primary" onclick="claimWins()">Riscuoti e continua</button>' +
    '</div>';
  overlay.classList.add('show');
}

async function claimWins(){
  const wins = getPendingWins();
  for(const w of wins){
    await sb.from('sabaudi_bets').update({ celebrated: true })
      .eq('player', currentUser).eq('event_id', w.eventId);
    const b = bets.find(x=>x.player===currentUser && x.event_id===w.eventId);
    if(b) b.celebrated = true;
  }
  const overlay = document.getElementById('winOverlay');
  overlay.classList.remove('show');
  overlay.innerHTML = '';
}

function statusBadge(ev){
  if(ev.resolved === true)  return '<span class="status vinta">✓ successo</span>';
  if(ev.resolved === false) return '<span class="status persa">✗ non successo</span>';
  return '<span class="status aperta">aperta</span>';
}

function renderBetTab(){
  if(events.length === 0) return '<div class="empty">Nessuna scommessa ancora. L\'admin può aggiungerne dal pannello.</div>';
  const rows = events.map(ev=>{
    const bet = myBet(ev.id);
    const draftVal = drafts[ev.id] || '';
    const locked = ev.resolved !== null;
    let betInfo = '';
    if(bet){
      let outcome = '';
      if(ev.resolved === true)  outcome = ' — vinta! +' + fmt(bet.amount*ev.odds) + ' sabaudi';
      else if(ev.resolved === false) outcome = ' — persa';
      betInfo = `<div class="my-bet">Hai puntato <b>${bet.amount} sabaudi</b>${outcome}</div>`;
    }
    return `
      <div class="event">
        <div class="emoji">${ev.emoji}</div>
        <div class="body">
          <p class="desc">${ev.descr}</p>
          <div class="meta">
            <span class="quota">quota ×${ev.odds}</span>
            ${statusBadge(ev)}
          </div>
          ${!locked ? `
          <div class="bet-row">
            <input type="number" min="1" step="1" placeholder="sabaudi" value="${draftVal}"
              oninput="drafts['${ev.id}']=this.value"
              onkeydown="if(event.key==='Enter') placeBetUI('${ev.id}');">
            <button class="btn btn-sea btn-small" onclick="placeBetUI('${ev.id}')">${bet?'Aggiorna':'Scommetti'}</button>
          </div>` : ''}
          ${betInfo}
        </div>
      </div>`;
  }).join('');
  return `<div class="section-title">Eventi</div>${rows}`;
}

function renderLeaderboard(){
  if(players.length === 0) return '<div class="empty">Ancora nessun iscritto.</div>';
  const list = players.map(n=>({
    name: n,
    balance: balanceOf(n),
    staked: stakedOf(n),
    open: betsOf(n).filter(b=>{const e=eventById(b.event_id); return e && e.resolved===null;}).length
  })).sort((a,b)=> (b.balance+b.staked) - (a.balance+a.staked));
  const medals = ['🥇','🥈','🥉'];
  const rows = list.map((u,i)=>`
    <div class="lb-row">
      <div class="lb-rank ${i<3?'gold':''}">${medals[i] || (i+1)}</div>
      <div class="lb-name">
        ${u.name}${u.name===currentUser?' (tu)':''}
        ${u.staked>0?`<div class="lb-sub">${u.staked} in gioco su ${u.open} scommess${u.open===1?'a':'e'}</div>`:''}
      </div>
      <div class="lb-balance">${u.balance} SAB</div>
    </div>`).join('');
  return `<div class="card">${rows}</div>
    <p class="hint" style="text-align:center;">Ordinati per patrimonio totale (saldo + sabaudi ancora in gioco).</p>`;
}

// carica l'SDK da una CDN alternativa se la prima e' bloccata
function loadScript(src, timeoutMs){
  return new Promise((ok,ko)=>{
    let done = false;
    const s = document.createElement('script');
    const finish = (fn,arg)=>{ if(!done){ done = true; fn(arg); } };
    s.src = src;
    s.onload  = ()=> finish(ok);
    s.onerror = ()=> finish(ko, new Error('bloccato: '+src));
    // se la CDN non risponde ne' con successo ne' con errore, non restiamo appesi
    setTimeout(()=> finish(ko, new Error('timeout: '+src)), timeoutMs || 6000);
    document.head.appendChild(s);
  });
}

// Alcuni ambienti (anteprime in sandbox) non riescono a trasmettere oggetti
// come Headers o AbortSignal e falliscono con DataCloneError.
// Questa fetch normalizza tutto in dati semplici prima di inoltrare.
async function safeFetch(input, init){
  const url = (typeof input === 'string') ? input
            : (input && input.url) ? input.url : String(input);
  const src = init || ((typeof input === 'object' && input) ? input : {});
  const headers = {};
  const h = src.headers;
  if(h){
    if(typeof h.forEach === 'function' && !Array.isArray(h)){ h.forEach((v,k)=>{ headers[k] = v; }); }
    else if(Array.isArray(h)){ h.forEach(pair=>{ headers[pair[0]] = pair[1]; }); }
    else { Object.keys(h).forEach(k=>{ headers[k] = h[k]; }); }
  }
  const opts = { method: src.method || 'GET', headers: headers };
  if(src.body !== undefined && src.body !== null){
    opts.body = (typeof src.body === 'string') ? src.body : JSON.stringify(src.body);
  }
  return fetch(url, opts); // niente signal, niente oggetti Request/Headers
}

async function ensureSdk(){
  if(window.supabase && window.supabase.createClient) return true;
  const mirrors = [
    'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js',
    'https://cdn.skypack.dev/@supabase/supabase-js@2'
  ];
  for(const m of mirrors){
    try{
      await loadScript(m);
      if(window.supabase && window.supabase.createClient) return true;
    }catch(e){ /* provo il prossimo */ }
  }
  return false;
}

async function init(){
  if(!configReady){ render(); return; }
  render(); // mostra subito "Caricamento..." invece di una pagina bianca

  // 1) la libreria Supabase e' arrivata?
  const sdkOk = await ensureSdk();
  if(!sdkOk){
    showDiag('Libreria Supabase non caricata',
      'Il browser non e\' riuscito a scaricare la libreria da internet. Succede tipicamente nelle anteprime che bloccano gli script esterni (come questa dentro Claude), oppure senza connessione.',
      'Questo NON e\' un problema di URL o chiave. Carica il file su GitHub Pages e aprilo da li\': funzionera\'.');
    return;
  }

  // 2) il client si crea?
  try{
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      global: { fetch: safeFetch },
      auth: { persistSession: false }
    });
  }catch(e){
    showDiag('URL o chiave non validi',
      'La libreria ha rifiutato i valori di configurazione.',
      'Ricontrolla SUPABASE_URL (senza /rest/v1/) e la chiave anon in cima al file.', e.message);
    return;
  }

  // 3) il database risponde?
  let probe;
  try{
    probe = await sb.from('sabaudi_events').select('id').limit(1);
  }catch(e){
    const m = String(e && e.message || e);
    if(/Load failed|Failed to fetch|NetworkError|ERR_BLOCKED|Content Security Policy|refused to connect/i.test(m)){
      showDiag('Rete bloccata da questo ambiente',
        'La richiesta e\' partita verso Supabase ma e\' stata bloccata prima di arrivare. URL, chiave e tabelle non c\'entrano.',
        'Se sei in un\'anteprima: caricalo su GitHub Pages. Se sei gia\' sul sito pubblicato: controlla la connessione e che il progetto Supabase non sia in pausa.', m);
    }else if(/DataCloneError|cloned|structuredClone/i.test(m)){
      showDiag('Anteprima non compatibile',
        'La configurazione e\' corretta, ma questo ambiente di anteprima non riesce a inoltrare la richiesta di rete (DataCloneError).',
        'Non c\'e\' niente da correggere nel file. Caricalo su GitHub Pages e aprilo da li\'.', m);
    }else{
      showDiag('Nessuna risposta dal database',
        'La richiesta di rete verso Supabase non e\' andata a buon fine.',
        'Controlla la connessione. Se sei in un\'anteprima con rete limitata, prova dal sito pubblicato.', m);
    }
    return;
  }

  if(probe.error){
    const msg = probe.error.message || '';
    const code = probe.error.code || '';
    if(code === '42P01' || /does not exist|relation/i.test(msg)){
      showDiag('Tabelle non trovate',
        'Il progetto risponde, ma le tabelle sabaudi_* non esistono.',
        'Esegui lo script SQL di creazione tabelle nell\'SQL Editor di Supabase, poi ricarica.', msg);
    }else if(/JWT|apikey|Invalid API key|401/i.test(msg + code)){
      showDiag('Chiave non accettata',
        'Il progetto risponde ma rifiuta la chiave anon.',
        'Ricopia la chiave anon da Settings -> API e sostituiscila in cima al file.', msg);
    }else if(/permission denied|RLS|policy/i.test(msg)){
      showDiag('Permessi negati',
        'Le tabelle esistono ma le policy RLS bloccano la lettura.',
        'Esegui le istruzioni create policy dello script SQL, poi ricarica.', msg);
    }else if(/Load failed|Failed to fetch|NetworkError|ERR_BLOCKED|Content Security Policy|refused to connect/i.test(msg)){
      showDiag('Rete bloccata da questo ambiente',
        'La richiesta e\' partita verso Supabase ma e\' stata bloccata prima di arrivare. URL, chiave e tabelle non c\'entrano: e\' l\'ambiente che non consente la connessione (tipico delle anteprime in sandbox).',
        'Se sei in un\'anteprima: non c\'e\' niente da correggere, caricalo su GitHub Pages. Se sei gia\' sul sito pubblicato: controlla la connessione e che il progetto Supabase non sia in pausa.', msg);
    }else if(/DataCloneError|could not be cloned|can not be cloned|structuredClone/i.test(msg)){
      showDiag('Anteprima non compatibile',
        'La libreria funziona e la configurazione e\' corretta, ma questo ambiente di anteprima non riesce a inoltrare la richiesta di rete (DataCloneError).',
        'Non c\'e\' niente da correggere nel file. Caricalo su GitHub Pages e aprilo da li\': funzionera\'.', msg);
    }else{
      showDiag('Errore dal database', 'Risposta inattesa da Supabase.',
        'Vedi il dettaglio qui sotto.', msg + ' ' + code);
    }
    return;
  }

  // 4) tutto ok
  try{
    await loadAll();
    const saved = localStorage.getItem(MY_NAME_KEY);
    if(saved && players.includes(saved)) currentUser = saved;
    render();
    subscribeRealtime();
  }catch(e){
    showDiag('Errore nel caricamento dei dati', 'Le tabelle rispondono ma qualcosa e\' andato storto leggendole.',
      'Vedi il dettaglio qui sotto.', e.message);
  }
}

init();
